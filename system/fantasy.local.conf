server {
    resolver 127.0.0.1;

    listen 80;

    server_name fantasy.local;

    root  /var/www/html/fantasy-football/public;
    index index.html index.php index.nginx-debian.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi.conf;

        # The default header buffer is a single 4k page, which Laravel's cookie
        # and Inertia headers can outgrow on a heavier page.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    location ^~ /(\@vite|@react-refresh|resources|assets) {
       proxy_pass http://fantasy.local:5173;
       #proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Host $host;
       proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
